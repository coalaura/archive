<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">archive</title>
  <desc id="description">A continuous paper ribbon folds into an ochre archival sleeve marked archive and emerges tightly compressed from its open right end. Streaming files into .tar.zst.</desc>
  <defs>
    <style>
      .paper { fill: #edf0e5; }
      .fold { fill: #8daaa1; }
      .edge { stroke: #536d65; stroke-width: 1.5; stroke-linejoin: round; }
      .crease { stroke: #f9faf2; stroke-width: 1.5; }
      .sleeve { fill: #dea45b; }
      .sleeve-top { fill: #edbf7d; }
      .sleeve-side { fill: #a97035; }
      .sleeve-inside { fill: #65482d; }
      .ink { stroke: #23322c; }
      .caption { fill: #2c3c30; }
    </style>
    <!-- One compressed fold; each file remains a separate frame in the stream. -->
    <g id="pleat" class="edge">
      <path class="paper" d="M0 94 10 107V221L0 208Z"/>
      <path class="fold" d="m10 107 6-13v114l-6 13Z"/>
      <path class="crease" d="M10 110v108"/>
    </g>
    <linearGradient id="outlet-shadow" x1="970" y1="0" x2="1014" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23322c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#23322c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The same ribbon, first loose, then progressively closer-folded. -->
  <g class="edge">
    <path class="paper" d="m66 84 88 41v123l-88-41Z"/>
    <path class="fold" d="m154 125 68-73v123l-68 73Z"/>
    <path class="paper" d="m222 52 59 54v123l-59-54Z"/>
    <path class="fold" d="m281 106 47-38v123l-47 38Z"/>
    <path class="paper" d="m328 68 39 35v123l-39-35Z"/>
    <path class="fold" d="m367 103 32-20v123l-32 20Z"/>
    <path class="paper" d="m399 83 38 16v123l-38-16Z"/>
  </g>
  <g class="crease">
    <path d="M154 128v116M281 109v116M367 106v116"/>
  </g>

  <!-- A narrow cardboard rim surrounds the recessed, open end. -->
  <g>
    <path class="sleeve-top" d="m413 89 24-24h565l-32 24Z"/>
    <path class="sleeve-side" d="m970 89 32-24v151l-32 24Z"/>
    <path class="sleeve-inside" d="m974 92 24-18v137l-24 18Z"/>
  </g>

  <!-- The packed ribbon overlaps the opening, emerging through its rim. -->
  <g transform="translate(10 0)">
    <path class="fold edge" d="m966 107 6-13v114l-6 13Z"/>
    <use href="#pleat" x="972"/>
    <use href="#pleat" x="988"/>
    <use href="#pleat" x="1004"/>
    <use href="#pleat" x="1020"/>
    <use href="#pleat" x="1036"/>
    <use href="#pleat" x="1052"/>
    <use href="#pleat" x="1068"/>
    <use href="#pleat" x="1084"/>
    <use href="#pleat" x="1100"/>
    <path class="paper edge" d="m1116 94 26 12v114l-26-12Z"/>
    <!-- The first folds emerge from the sleeve's shadow into the light. -->
    <path fill="url(#outlet-shadow)" d="M966 107 972 94 982 107 988 94 998 107 1004 94 1014 107V221L1004 208 998 221 988 208 982 221 972 208 966 221Z"/>
  </g>

  <!-- The project name is printed on the sleeve's front face. -->
  <g>
    <path class="sleeve" d="M413 89h557v151H413Z"/>
  </g>

  <!-- Outlined, custom lowercase lettering: no font dependency for the name. -->
  <g class="ink" transform="translate(460 110) scale(1.12 .92)" stroke-width="10" stroke-linecap="square" stroke-linejoin="round">
    <ellipse cx="24" cy="58" rx="20" ry="22"/>
    <path d="M44 33v47"/>
    <!-- A vertical tangent keeps the shoulder cap inside the r's stem. -->
    <path d="M69 80V33m0 16c0-13 15-20 27-17"/>
    <path d="M151 37c-20-18-41-4-41 19s21 37 41 19"/>
    <path d="M176 80V0m0 49c0-25 42-25 42 0v31"/>
    <path d="M245 35v45"/>
    <path d="m270 34 22 46h4l22-46"/>
    <path d="M341 55h44c0-34-44-34-44 0 0 27 26 34 43 19"/>
  </g>
  <circle cx="734.4" cy="119.2" r="6.2" fill="#23322c"/>
  <text class="caption" x="460" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22">Streaming files into .tar.zst</text>
</svg>
